# Optional Render Blueprint for the backend (Docker). Set secrets in the dashboard.
services:
  - type: web
    name: ai-chat-backend
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////data/app.db
    # Persistent disks need a paid instance; on the free tier history resets on redeploy.
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
